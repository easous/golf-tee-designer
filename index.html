<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golf Tee Design Studio</title><style>body{font-family:Arial,sans-serif;background:#f5f5f4;color:#1c1917;margin:0;padding:24px}.wrap{max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:24px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;box-shadow:0 2px 8px #0001}label{font-size:13px;color:#57534e;display:block;margin-top:12px}input[type=color]{width:58px;height:38px}.stripe{background:#fafaf9;border:1px solid #e7e5e4;border-radius:12px;padding:12px;margin:12px 0}button{padding:9px 13px;border:1px solid #ccc;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#1d4f3b;color:#fff;border:0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}svg{width:100%;max-height:650px}.preview{min-height:650px;display:flex;align-items:center;justify-content:center}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Golf Tee Design Studio</h1><p>Change the tee color, add multiple independently colored stripes, upload a logo, and export your concept.</p><div class="grid"><div class="card"><h3>Tee color</h3><div class="row"><input id="teeColor" type="color" value="#f4f0df"><span id="teeHex">#f4f0df</span></div><hr><div class="row"><h3 style="flex:1">Stripes / bands</h3><button id="addStripe">+ Add stripe</button></div><div id="stripeControls"></div><hr><h3>Logo</h3><input id="logoUpload" type="file" accept="image/*,.svg"><div id="logoControls" style="display:none"><label>Logo size</label><input id="logoSize" type="range" min="25" max="125" value="72" style="width:100%"><label>Logo position</label><input id="logoY" type="range" min="55" max="525" value="165" style="width:100%"><button id="removeLogo">Remove logo</button></div><hr><div class="row"><button id="reset">Reset</button><button class="primary" id="export">Export SVG</button></div></div><div class="card"><h2>Design preview</h2><div class="preview"><svg id="teeSvg" viewBox="0 0 360 700" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="teeClip"><path d="M110 30 Q180 7 250 30 L241 58 Q225 70 214 82 L202 528 L180 650 L158 528 L146 82 Q135 70 119 58 Z"/></clipPath><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".18"/></filter></defs><g filter="url(#shadow)"><path id="teeBody" d="M110 30 Q180 7 250 30 L241 58 Q225 70 214 82 L202 528 L180 650 L158 528 L146 82 Q135 70 119 58 Z" fill="#f4f0df" stroke="#b7b1a3" stroke-width="2"/><g id="art" clip-path="url(#teeClip)"></g></g><line x1="60" y1="670" x2="300" y2="670" stroke="#d6d3d1" stroke-dasharray="6 6"/></svg></div></div></div></div><script>let stripes=[{id:1,y:92,height:8,color:'#1d4f3b'}],logo=null;const $=x=>document.getElementById(x);function render(){ $('teeBody').setAttribute('fill',$('teeColor').value);$('teeHex').textContent=$('teeColor').value;let a=$('art');a.innerHTML='';stripes.forEach(s=>{let r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x','100');r.setAttribute('y',s.y);r.setAttribute('width','160');r.setAttribute('height',s.height);r.setAttribute('fill',s.color);a.appendChild(r)});if(logo){let im=document.createElementNS('http://www.w3.org/2000/svg','image'),z=+$('logoSize').value;im.setAttribute('href',logo);im.setAttribute('x',180-z/2);im.setAttribute('y',$('logoY').value);im.setAttribute('width',z);im.setAttribute('height',z);im.setAttribute('preserveAspectRatio','xMidYMid meet');a.appendChild(im)}renderControls()}function renderControls(){let c=$('stripeControls');c.innerHTML='';stripes.forEach((s,i)=>{let d=document.createElement('div');d.className='stripe';d.innerHTML=`<div class="row"><b style="flex:1">Stripe ${i+1}</b><button data-del="${s.id}">Delete</button></div><label>Color</label><input type="color" data-color="${s.id}" value="${s.color}"><label>Position</label><input style="width:100%" type="range" min="55" max="525" data-y="${s.id}" value="${s.y}"><label>Thickness</label><input style="width:100%" type="range" min="2" max="300" data-h="${s.id}" value="${s.height}">`;c.appendChild(d)});c.querySelectorAll('[data-color]').forEach(e=>e.oninput=()=>{stripes.find(s=>s.id==e.dataset.color).color=e.value;render()});c.querySelectorAll('[data-y]').forEach(e=>e.oninput=()=>{stripes.find(s=>s.id==e.dataset.y).y=+e.value;render()});c.querySelectorAll('[data-h]').forEach(e=>e.oninput=()=>{stripes.find(s=>s.id==e.dataset.h).height=+e.value;render()});c.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{stripes=stripes.filter(s=>s.id!=e.dataset.del);render()})}$('teeColor').oninput=render;$('addStripe').onclick=()=>{stripes.push({id:Date.now(),y:Math.min(260,92+stripes.length*22),height:8,color:['#1d4f3b','#ffffff','#c7a54b','#14213d'][stripes.length%4]});render()};$('logoUpload').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{logo=r.result;$('logoControls').style.display='block';render()};r.readAsDataURL(f)};$('logoSize').oninput=render;$('logoY').oninput=render;$('removeLogo').onclick=()=>{logo=null;$('logoControls').style.display='none';render()};$('reset').onclick=()=>{$('teeColor').value='#f4f0df';stripes=[{id:1,y:92,height:8,color:'#1d4f3b'}];logo=null;$('logoControls').style.display='none';render()};$('export').onclick=()=>{let src=new XMLSerializer().serializeToString($('teeSvg')),b=new Blob([src],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='golf-tee-concept.svg';a.click();URL.revokeObjectURL(u)};render();</script></body></html>
